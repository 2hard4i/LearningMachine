<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-Know | Glass Slider</title>

<link rel="stylesheet" href="style.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

html,body{
  height:100%;
  overflow-x:hidden;
  background:#000;
  color:white;
}

/* ⭐ STAR BACKGROUND FIX */
.wrapper{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

/* HEADER */
header{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 8px 32px rgba(0,0,0,0.25);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  position:sticky;
  top:0;
  z-index:10;
  border-radius:0 0 20px 20px;
}

.logo{
  display:flex;
  align-items:center;
}

.logo img{
  width:45px;
  height:45px;
  border-radius:50%;
  margin-right:10px;
}

nav button{
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  color:white;
  padding:10px 18px;
  margin-left:12px;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:0.3s;
}

nav button:hover{
  background:rgba(255,255,255,0.25);
  transform:scale(1.05);
}

/* HERO */
.hero{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:80vh;
  padding:40px 20px;
}

/* SLIDER */
.slider-wrapper{
  position:relative;
  width:90%;
  max-width:500px;
  height:400px;
}

.hero-slider{
  width:100%;
  height:100%;
  border-radius:20px;
  overflow:hidden;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

.slides{
  display:flex;
  width:100%;
  height:100%;
  transition:transform 0.8s ease-in-out;
}

.slide{
  min-width:100%;
  height:100%;
}

.slide img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Buttons */
.slide-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.3);
  color:white;
  width:45px;
  height:45px;
  border-radius:50%;
  cursor:pointer;
  font-size:22px;
  z-index:5;
  transition:0.3s;
}

.slide-btn:hover{
  background:rgba(255,255,255,0.3);
  transform:translateY(-50%) scale(1.1);
}

.prev{ left:10px; }
.next{ right:10px; }

/* FOOTER */
footer{
  text-align:center;
  padding:15px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,0.15);
  font-size:13px;
}

/* 📱 MOBILE OPTIMIZATION */
@media(max-width:768px){
  header{
    flex-direction:column;
    gap:10px;
  }

  nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
  }

  nav button{
    margin:5px;
  }

  .slider-wrapper{
    height:300px;
  }
}
</style>
</head>

<body>

<!-- ⭐ BACKGROUND -->
<section class="wrapper">
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>
</section>

<header>
  <div class="logo">
    <img src="https://i.pinimg.com/736x/24/a3/b2/24a3b2a8be983c30d03cb51d683a1532.jpg">
    <h1>T-Know</h1>
  </div>
  <nav>
    <button onclick="location.href='index.html'">Home</button>
    <button onclick="location.href='about.html'">About</button>
    <button onclick="location.href='contact.html'">Contact</button>
  </nav>
</header>

<section class="hero">
  <div class="slider-wrapper">
    <button class="slide-btn prev" onclick="moveSlide(-1)">❮</button>
    <div class="hero-slider">
      <div class="slides" id="slides">
        <div class="slide"><img src="https://th.bing.com/th/id/OIP.VeYtPnWjQH7YL9qp7AcXxgHaHa"></div>
        <div class="slide"><img src="https://tse3.mm.bing.net/th/id/OIP.OiT5eb0Or11trRVqXwNxXgAAAA"></div>
        <div class="slide"><img src="https://tse4.mm.bing.net/th/id/OIP.DCgsIxbgoKOdw9Tlq2qEQwHaHa"></div>
      </div>
    </div>
    <button class="slide-btn next" onclick="moveSlide(1)">❯</button>
  </div>
</section>

<footer>
  <p>Created by Student | T-Know | Machine Learning Academic Page</p>
</footer>

<script>
let index = 0;
const slides = document.getElementById("slides");
const total = slides.children.length;

function moveSlide(direction){
  index += direction;

  if(index < 0) index = total - 1;
  if(index >= total) index = 0;

  slides.style.transform = `translateX(-${index * 100}%)`;
}
</script>

</body>
</html>
