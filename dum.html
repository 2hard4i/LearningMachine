<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-Know | Glass Slider</title>

<link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

html,body{
height:100%;
overflow-x:hidden;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.15);
box-shadow:0 8px 32px rgba(0,0,0,0.25);
color:white;
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:22px;
font-weight:700;
}

/* NAVIGATION */

#navbar{
display:flex;
gap:18px;
}

#navbar a{
color:white;
text-decoration:none;
font-weight:600;
padding:8px 12px;
border-radius:8px;
transition:0.3s;
}

#navbar a:hover{
background:rgba(255,255,255,0.15);
}

.menu-btn{
display:none;
font-size:26px;
cursor:pointer;
color:white;
}

/* HERO */

.hero{
display:flex;
justify-content:center;
align-items:center;
padding:80px 20px;
}

.slider-wrapper{
position:relative;
width:360px;
height:360px;
overflow:hidden;
border-radius:50%;
}

.hero-slider{
width:100%;
height:100%;
border-radius:20px;
overflow:hidden;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,0.2);
box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

.slides{
display:flex;
width:100%;
height:100%;
transition:transform 0.8s ease-in-out;
}

.slide{
min-width:100%;
height:100%;
}

.slide img{
width:100%;
height:100%;
object-fit:cover;
}

/* FOOTER */

footer{
text-align:center;
padding:15px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
border-top:1px solid rgba(255,255,255,0.15);
color:red;
font-size:13px;
margin-top:40px;
}

/* MOBILE NAV */

@media(max-width:768px){

#navbar{
position:absolute;
top:70px;
right:0;
background:rgba(0,0,0,0.7);
flex-direction:column;
width:200px;
padding:20px;
display:none;
border-radius:12px;
}

#navbar.active{
display:flex;
}

.menu-btn{
display:block;
}

.slider-wrapper{
width:90%;
height:300px;
}

}

/* TOOLTIP */

.tooltip{
position:relative;
}

.tooltiptext{
visibility:hidden;
opacity:0;
position:absolute;
top:35px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.8);
color:white;
padding:6px 10px;
border-radius:8px;
font-size:12px;
white-space:nowrap;
transition:0.3s;
}

.tooltip:hover .tooltiptext{
visibility:visible;
opacity:1;
}

/* ANIMATION */

.animate{
opacity:0;
transform:translateY(40px);
transition:all 0.8s ease;
}

.animate.show{
opacity:1;
transform:translateY(0);
}

#title{
color:white;
text-align:center;
margin-top:40px;
font-size:30px;
}
/* Logo pop-up from small to normal */
.logo.animate {
  opacity: 0;
  transform: scale(0.5); /* start smaller */
  transition: all 1.5s ease; /* slow and smooth */
}

.logo.animate.show {
  opacity: 1;
  transform: scale(1); /* full size */
}
</style>
</head>

<body>

<!-- STAR BACKGROUND -->
<section class="wrapper">
<div id="stars"></div>
<div id="stars2"></div>
<div id="stars3"></div>
</section>

<!-- HEADER -->

<header class="animate">

<div class="logo">
T-Know
</div>

<nav id="navbar">

<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>

<a href="supv.html" class="tooltip">
SLM
<span class="tooltiptext">Supervised Learning</span>
</a>

<a href="unsupv.html" class="tooltip">
ULM
<span class="tooltiptext">Unsupervised Learning</span>
</a>

<a href="renf.html" class="tooltip">
RLM
<span class="tooltiptext">Reinforcement Learning</span>
</a>

<a href="advo.html">Advocacy</a>

</nav>

<div class="menu-btn" id="menu-btn">
☰
</div>

</header>

<!-- HERO -->

<section class="hero animate">

<div class="slider-wrapper">

<div class="hero-slider">

<div class="slides" id="slides">

<div class="logo animate">
<a href="renf.html">
<img src="550d80c5-8b6d-4c5a-beca-2e2e21a3bb21.png" alt="Slide">
</a>
</div>

</div>

</div>

</div>

</section>

<div id="title" class="animate">
<span>Learning Machine</span>
</div>

<!-- MOBILE MENU SCRIPT -->

<script>

const menuBtn = document.getElementById("menu-btn");
const navbar = document.getElementById("navbar");

menuBtn.onclick = () =>{
navbar.classList.toggle("active");
};

</script>

<!-- SCROLL ANIMATION -->

<script>

const elements = document.querySelectorAll('.animate');

function reveal(){

elements.forEach(el =>{

const windowHeight = window.innerHeight;
const elementTop = el.getBoundingClientRect().top;

if(elementTop < windowHeight - 100){
el.classList.add('show');
}

});

}

window.addEventListener('scroll',reveal);
window.addEventListener('load',reveal);

</script>
<script>
  const elements = document.querySelectorAll('.animate');

function reveal(){
    elements.forEach(el => {
        const windowHeight = window.innerHeight;
        const elementTop = el.getBoundingClientRect().top;
        if(elementTop < windowHeight - 100){
            el.classList.add('show');
        }
    });
}

window.addEventListener('scroll', reveal);
window.addEventListener('load', reveal);
</script>
</body>
</html>;
