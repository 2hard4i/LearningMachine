<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-Know | Glass Slider</title>
<link rel="stylesheet" href="style.css">
<style>
/* ----------------- RESET ----------------- */
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

html, body {
  height:100%;
  overflow-x:hidden;
  background:#0f172a;
  color:white;
}

/* ----------------- HEADER ----------------- */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 8px 32px rgba(0,0,0,0.25);
  position:sticky;
  top:0;
  z-index:1000;
}

/* Logo */
.logo {
  font-size:22px;
  font-weight:700;
}

/* ----------------- NAVIGATION ----------------- */
#navbar {
  display:flex;
  gap:18px;
}

#navbar a {
  color:white;
  text-decoration:none;
  font-weight:600;
  padding:8px 12px;
  position:relative;
  opacity:0;
  transform:translateY(-20px);
  display:inline-block;
  transition:0.3s;
}

/* Tooltip for short links */
.tooltiptext {
  visibility:hidden;
  opacity:0;
  position:absolute;
  top:35px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.8);
  color:white;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  white-space:nowrap;
  transition:0.3s;
}

.tooltip:hover .tooltiptext {
  visibility:visible;
  opacity:1;
}

/* ----------------- NAV LINKS ANIMATION ----------------- */
#navbar a.animate {
  animation: linkPop 0.6s forwards;
}

#navbar a:not(:last-child)::after {
  content:"|";
  color:white;
  margin-left:8px;
  opacity:0;
  transform:scaleY(0);
  display:inline-block;
  animation:swordSeparator 0.6s forwards;
}

/* Keyframes */
@keyframes linkPop {
  0% { opacity:0; transform:translateY(-20px) scale(0.8); }
  100% { opacity:1; transform:translateY(0) scale(1); }
}

@keyframes swordSeparator {
  0% { opacity:0; transform:scaleY(0); }
  50% { opacity:1; transform:scaleY(1.2); }
  100% { opacity:1; transform:scaleY(1); }
}

/* Hover effect */
#navbar a:hover {
  background: rgba(255,255,255,0.15);
  border-radius:8px;
}

/* ----------------- HAMBURGER MENU ----------------- */
.menu-btn {
  display:none;
  font-size:26px;
  cursor:pointer;
  color:white;
}

@media(max-width:768px){
  #navbar {
    position:absolute;
    top:70px;
    right:0;
    background:rgba(0,0,0,0.7);
    flex-direction:column;
    width:200px;
    padding:20px;
    display:none;
    border-radius:12px;
  }

  #navbar.active {
    display:flex;
  }

  .menu-btn {
    display:block;
  }

  #navbar a:not(:last-child)::after {
    content:""; /* remove "|" on mobile */
  }
}

/* ----------------- HERO ----------------- */
.hero {
  display:flex;
  justify-content:center;
  align-items:center;
  padding:80px 20px;
}

.slider-wrapper {
  position:relative;
  width:360px;
  height:360px;
  overflow:hidden;
  border-radius:50%;
  opacity:0;
  transform:scale(0.5);
  transition:all 1.5s ease;
}

.slider-wrapper.show {
  opacity:1;
  transform:scale(1);
}

.hero-slider {
  width:100%;
  height:100%;
  border-radius:20px;
  overflow:hidden;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(25px);
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

.slides {
  display:flex;
  width:100%;
  height:100%;
  transition:transform 0.8s ease-in-out;
}

.slide img {
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ----------------- TITLE ----------------- */
#title {
  color:white;
  text-align:center;
  margin-top:40px;
  font-size:30px;
  opacity:0;
  transform:translateY(40px);
  transition:all 1s ease;
}

#title.show {
  opacity:1;
  transform:translateY(0);
}

/* ----------------- FOOTER ----------------- */
footer {
  text-align:center;
  padding:15px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,0.15);
  color:red;
  font-size:13px;
  margin-top:40px;
}
//* Hero text below image, centered */
.hero-text {
  text-align: center;
  margin-top: 20px; /* space below image */
  color: white;
  background: rgba(255, 255, 255, 0.08); /* subtle glass effect */
  backdrop-filter: blur(10px);
  padding: 15px 25px;
  border-radius: 12px;
  display: inline-block;
  opacity: 0;
  transform: translateY(20px);
  transition: all 1s ease;
}

/* Animate text pop-up */
.hero-text.show {
  opacity: 1;
  transform: translateY(0);
}

/* Headings and paragraphs style */
.hero-text h2 {
  margin-bottom: 8px;
  font-size: 26px;
}

.hero-text p {
  font-size: 14px;
  opacity: 0.8;
}
.hero-text {
   color: #fff;
    text-align: center;
    font-family: Lato;
    font-weight: 300;
    font-size: 50px;
    letter-spacing: 10px;
    padding-left: 10px;
    background: -webkit-linear-gradient(white, #38495a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
#hero-text span {
    background: -webkit-linear-gradient(white, #38495a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero-text.show {
  opacity: 1;
  transform: scale(1);
}
</style>
</head>
<body>

<div id="stars"></div>

<div class="hero-text">

<!-- FOOTER -->
<footer>

<!-- SCRIPTS -->
<script>
// Hamburger toggle
const menuBtn = document.getElementById("menu-btn");
const navbar = document.getElementById("navbar");
menuBtn.onclick = () => navbar.classList.toggle("active");

// Animate nav links with staggered effect
const navLinks = document.querySelectorAll('#navbar a');
navLinks.forEach((link, index) => {
  setTimeout(() => link.classList.add('animate'), index * 200);
});

// Hero image and title animation on load
window.addEventListener('load', () => {
  document.getElementById('hero-image').classList.add('show');
  document.getElementById('title').classList.add('show');
});
// Animate hero text on page load
window.addEventListener('load', () => {
  document.querySelector('.hero-text').classList.add('show');
});
</script>
</body>
</html>
