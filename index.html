<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-Know | Glass Slider</title>

<!-- Your Star Background CSS -->
<link rel="stylesheet" href="style.css">

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

html, body {
  height:100%;
  overflow-x:hidden;
}

/* HEADER */
header {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  position:sticky;
  top:0;
  z-index:10;
  border-radius:0 0 20px 20px;
}

.logo {
  display:flex;
  align-items:center;
}

.logo img {
  width:45px;
  height:45px;
  border-radius:50%;
  margin-right:10px;
}

nav button {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  color:white;
  padding:10px 18px;
  margin-left:12px;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:0.3s;
}

nav button:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.05);
}

/* HERO */
.hero {
  display:flex;
  justify-content:center;
  align-items:center;
  padding:80px 20px;
}

/* SLIDER */
.slider-wrapper {
  position:relative;
  width:360px;
  height:360px;
  overflow:hidden;
}

.hero-slider {
  width:100%;
  height:100%;
  border-radius:20px;
  overflow:hidden;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}

.slides {
  display:flex;
  width:100%;
  height:105%;
  transition: transform 0.8s ease-in-out;
}

.slide {
  min-width:100%;
  height:100%;
}

.slide img {
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Buttons */
.slide-btn {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background: rgba(9, 1, 1, 0.575);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.25);
  color:rgb(0, 0, 0);
  width:50px;
  height:50px;
  border-radius:50%;
  cursor:pointer;
  font-size:22px;
  z-index:5;
  transition:0.3s;
}

.slide-btn:hover {
  background: rgba(53, 6, 224, 0.382);
  transform:translateY(-50%) scale(1.1);
}

.prev { left:10px; }
.next { right:10px; }

footer {
  text-align:center;
  padding:15px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,0.15);
  color:white;
  font-size:13px;
  margin-top:40px;
}

@media(max-width:768px){
  .slider-wrapper { width:90%; height:300px; }
}
</style>
</head>

<body>

<!-- ⭐ STAR BACKGROUND (FROM YOUR style.css) -->
<section class="wrapper">
  <div id="stars"></div>
  <div id="stars2"></div>
  <div id="stars3"></div>
          <div id="title">
    
            <br>
            <br>
            <br>
    
            <span>Learning Machine</span>
        </div>
    </section>
</section>

<header>
  <div class="logo">
    <img src="https://i.pinimg.com/736x/24/a3/b2/24a3b2a8be983c30d03cb51d683a1532.jpg">
    <h1>T-Know</h1>
  </div>
  <nav>
    <button onclick="location.href='index.html'">Home</button>
    <button onclick="location.href='about.html'">About</button>
    <button onclick="location.href='contact.html'">Contact</button>
  </nav>
</header>

<section class="hero">
  <div class="slider-wrapper">
    <button class="slide-btn prev" onclick="moveSlide(-1)">❮</button>
    <div class="hero-slider">
  <div class="slide">
  <a href="supv.html">
    <img src="https://th.bing.com/th/id/OIP.VeYtPnWjQH7YL9qp7AcXxgHaHa" alt="Slide 1">
  </a>
</div>

<div class="slide">
  <a href="unsupv.html">
    <img src="https://tse3.mm.bing.net/th/id/OIP.OiT5eb0Or11trRVqXwNxXgAAAA" alt="Slide 2">
  </a>
</div>

<div class="slide">
  <a href="reinforce.html">
    <img src="https://tse4.mm.bing.net/th/id/OIP.DCgsIxbgoKOdw9Tlq2qEQwHaHa" alt="Slide 3">
  </a>
</div>
    </div>
    <button class="slide-btn next" onclick="moveSlide(1)">❯</button>
  </div>
              <br>
</section>


<script>
let index = 0;
const slides = document.getElementById("slides");
const total = slides.children.length;

function moveSlide(direction) {
  // Increase or decrease index
  index += direction;

  // Loop around
  if (index < 0) index = total - 1;
  if (index >= total) index = 0;

  // Move the slides
  slides.style.transform = `translateX(-${index * 100}%)`;
}
</script>
</body>
</html>
