<style>
  .logo{
font-size:22px;
font-weight:700;
color:#fff;

animation:neon 1.5s infinite alternate;
}

@keyframes neon{

from{
text-shadow:
0 0 5px #fff,
0 0 10px #0ea5e9,
0 0 20px #0ea5e9,
0 0 40px #0ea5e9;
}

to{
text-shadow:
0 0 10px #fff,
0 0 20px #6366f1,

/* ----------------- RESET ----------------- */
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

html, body {
  height:100%;
  overflow-x:hidden;
  background:#0f172a;
  color:white;
}

/* ----------------- HEADER ----------------- */
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 8px 32px rgba(0,0,0,0.25);
  position:sticky;
  top:0;
  z-index:1000;
}

/* Logo */
.logo {
  font-size:22px;
  font-weight:700;
}

/* ----------------- NAVIGATION ----------------- */
#navbar {
  display:flex;
  gap:18px;
}

#navbar a {
  color:white;
  text-decoration:none;
  font-weight:600;
  padding:8px 12px;
  position:relative;
  opacity:0;
  transform:translateY(-20px);
  display:inline-block;
  transition:0.3s;
}

/* Tooltip for short links */
.tooltiptext {
  visibility:hidden;
  opacity:0;
  position:absolute;
  top:35px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.8);
  color:white;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  white-space:nowrap;
  transition:0.3s;
}

.tooltip:hover .tooltiptext {
  visibility:visible;
  opacity:1;
}

/* ----------------- NAV LINKS ANIMATION ----------------- */
#navbar a.animate {
  animation: linkPop 0.6s forwards;
}

#navbar a:not(:last-child)::after {
  content:"|";
  color:white;
  margin-left:8px;
  opacity:0;
  transform:scaleY(0);
  display:inline-block;
  animation:swordSeparator 0.6s forwards;
}

/* Keyframes */
@keyframes linkPop {
  0% { opacity:0; transform:translateY(-20px) scale(0.8); }
  100% { opacity:1; transform:translateY(0) scale(1); }
}

@keyframes swordSeparator {
  0% { opacity:0; transform:scaleY(0); }
  50% { opacity:1; transform:scaleY(1.2); }
  100% { opacity:1; transform:scaleY(1); }
}

/* Hover effect */
#navbar a:hover {
  background: rgba(255,255,255,0.15);
  border-radius:8px;
}

/* ----------------- HAMBURGER MENU ----------------- */
.menu-btn {
  display:none;
  font-size:26px;
  cursor:pointer;
  color:white;
}

@media(max-width:768px){
  #navbar {
    position:absolute;
    top:70px;
    right:0;
    background:rgba(0,0,0,0.7);
    flex-direction:column;
    width:200px;
    padding:20px;
    display:none;
    border-radius:12px;
  }

  #navbar.active {
    display:flex;
  }

  .menu-btn {
    display:block;
  }

  #navbar a:not(:last-child)::after {
    content:""; /* remove "|" on mobile */
  }
}

/* ----------------- HERO ----------------- */
.hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
}

.slider-wrapper {
  width: 360px;
  height: 360px;
  overflow: hidden;
  border-radius: 50%;
  opacity: 0;
  transform: scale(0.5);
  transition: all 1.5s ease;
}

.hero-slider {
  width: 100%;
  height: 100%;
  border-radius: 20px;
  overflow: hidden;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(25px);
  border:1px solid rgba(255,255,255,0.2);
  box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

.slide img.hero-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Hero text */
.hero-text {

    position: relative;
    top: 20%;
    left: 0;
    right: 0;
    color: #fff;
    text-align: center;
    font-family: Lato;
    font-weight: 300;
    font-size: 50px;
    letter-spacing: 10px;
    padding-left: 10px;
      color: white;
  font-size: 32px;
  font-weight: 700;
  opacity: 0;
  transform: scale(0.5);
  transition: all 1s ease;
}

/* SHOW class for animation */
.show {
  opacity: 1 !important;
  transform: scale(1) !important;
}
/* H1 Entrance Animation */
@keyframes h1Entrance {
  0% {
    opacity: 0;
    transform: translateY(50px) rotateX(20deg) scale(0.8);
    filter: blur(5px);
  }
  60% {
    opacity: 1;
    transform: translateY(-10px) rotateX(-2deg) scale(1.05);
    filter: blur(0);
  }
  80% {
    transform: translateY(5px) rotateX(1deg) scale(0.98);
  }
  100% {
    opacity: 1;
    transform: translateY(0) rotateX(0deg) scale(1);
    filter: blur(0);
  }
}

h1.animated-h1 {
  opacity: 0;               /* start hidden */
  animation: h1Entrance 1.5s ease-out forwards;
}
</style>
</head>

<!-- SCRIPTS -->
<script>
// Hamburger toggle
const menuBtn = document.getElementById("menu-btn");
const navbar = document.getElementById("navbar");
menuBtn.onclick = () => navbar.classList.toggle("active");

// Animate nav links with staggered effect
const navLinks = document.querySelectorAll('#navbar a');
navLinks.forEach((link, index) => {
  setTimeout(() => link.classList.add('animate'), index * 200);
});

// Hero image and title animation on load
window.addEventListener('load', () => {
  document.getElementById('hero-image').classList.add('show');
  document.getElementById('title').classList.add('show');
});
// Animate hero text on page load
window.addEventListener('load', () => {
  document.querySelector('.hero-text').classList.add('show');
});
</script>
<script>
// Animate image and text on page load
window.addEventListener('load', () => {
  document.querySelector('.slider-wrapper').classList.add('show');
  document.querySelector('.hero-text').classList.add('show');
});

window.addEventListener('DOMContentLoaded', () => {
  const elements = document.querySelectorAll('.animated-text');
  elements.forEach((el, index) => {
    el.style.animationDelay = `${index * 0.3}s`; // stagger by 0.3s
  });
});
</script>
